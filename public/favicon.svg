<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0f3d2e"/>
  
  <!-- Ledger lines -->
  <line x1="18" y1="18" x2="46" y2="18" stroke="#f7f3ea" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="18" y1="26" x2="46" y2="26" stroke="#f7f3ea" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Pulse line - the interesting part -->
  <path d="M14 42 L24 42 L28 32 L34 50 L38 42 L50 42" 
    fill="none" 
    stroke="#c9a86a" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"/>

  <!-- Dot at end of pulse -->
  <circle cx="50" cy="42" r="3" fill="#c9a86a"/>
</svg>